name: 24x7 Video Bot Runner

on:
  schedule:
    # Automatically triggers a fresh runner every 6 hours (enables 24x7 loop)
    - cron: '0 */6 * * *'
  
  workflow_dispatch: # Keeps the manual "Run workflow" button available

jobs:
  run-bot-loop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run 24x7 Script with Live Logs
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASS: ${{ secrets.PROXY_PASS }}
        run: |
          python -u bot.py
